<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Epic Chess">
  <!-- EMBLÈME D'EPIC CHESS : un ballon d'alchimiste couronné.
       Le jeu croise les échecs et l'alchimie : la fiole seule ne disait que
       la moitié, et à 16 px elle ressemblait à n'importe quelle icône de
       laboratoire. La couronne (le Monarque, la pièce à protéger) posée sur
       le ballon dit les deux d'un coup, et reste lisible en favicon.
       Le même dessin est repris en grand par EMBLEM_SVG (js/main.js).
       Couleurs reprises des variables de css/style.css : fond ardoise
       #0e1216, laiton #c19a45, reflets #e6c576, potion vert-de-gris #2fb197. -->
  <rect width="64" height="64" rx="14" fill="#0e1216"/>
  <path d="M22.5 16 20 5.5l6.4 4.5L32 3l5.6 7 6.4-4.5L41.5 16z"
        fill="#e6c576" stroke="#c19a45" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M27 18.5v9M37 18.5v9" stroke="#c19a45" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="16.5" fill="none" stroke="#c19a45" stroke-width="2.8"/>
  <path d="M16.13 46.5A16.5 16.5 0 0 0 47.87 46.5Z" fill="#2fb197"/>
  <circle cx="27" cy="52" r="2.2" fill="#e6c576"/>
  <circle cx="36.5" cy="49" r="1.5" fill="#e6c576" opacity=".7"/>
</svg>
