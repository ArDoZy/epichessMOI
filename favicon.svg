<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Epic Chess">
  <!-- EMBLÈME D'EPIC CHESS : la FUSION, dans un ballon d'alchimiste couronné.
       Le jeu ne croise pas seulement les échecs et l'alchimie : il les FOND
       l'un dans l'autre. La fiole seule ne disait que la moitié, et la
       couronne posée dessus ne disait que « échecs + laboratoire », pas ce
       qui se passe dedans.
       Ce qui monte du bouillon est donc une pièce COUPÉE EN DEUX par une
       fêlure lumineuse : à gauche la silhouette d'un pion ordinaire, à
       droite la même pièce devenue créature (échine et corne). Deux petites
       pièces d'échecs flottent autour du ballon pour que le jeu se lise même
       à 16 px, où le détail de la fusion se réduit à une masse.
       Le tracé est écrit ici dans un carré de 100 (mis à l'échelle 0.64
       ci-dessous) et REPRIS À L'IDENTIQUE par EMBLEM_SVG (js/main.js) : une
       seule géométrie, deux fichiers, l'onglet et le jeu montrent la même
       chose. Couleurs reprises des variables de css/style.css : fond ardoise
       #0e1216, laiton #c19a45, reflets #e6c576, potion vert-de-gris #2fb197. -->
  <rect width="64" height="64" rx="14" fill="#0e1216"/>
  <g transform="scale(.64)">
    <!-- Pièces satellites : un pion et un cavalier, à mi-hauteur du ballon.
         Mêmes silhouettes que le fond d'attente (tools/gen-duel-bg.js), donc
         reconnaissables : un blob de trois traits ne l'était pas. -->
    <g fill="#c19a45" opacity=".78">
      <path transform="translate(3 31) scale(.21)" d="M50 8c-9 0-16 7-16 16 0 5 2 9 6 12-8 6-13 16-15 28h50c-2-12-7-22-15-28 4-3 6-7 6-12 0-9-7-16-16-16zM22 66h56l6 12H16zM12 80h76c5 0 8 4 8 9v11H4V89c0-5 3-9 8-9z"/>
      <path transform="translate(77 30) scale(.22)" d="M34 100c0-17 2-29 8-40l-11 8c-9 6-19 3-21-6-3-11 3-22 12-31C30 24 39 18 46 11c6-6 9-11 11-19l9 9 8-8c15 12 26 30 30 49 4 19 5 39 5 58z"/>
    </g>
    <!-- Couronne : le Monarque, la pièce à protéger. -->
    <path d="M34 24 30 7l10 7 10-11 10 11 10-7-4 17z"
          fill="#e6c576" stroke="#c19a45" stroke-width="2" stroke-linejoin="round"/>
    <!-- Col et ballon de l'alambic. -->
    <path d="M42 28v12M58 28v12" stroke="#c19a45" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="50" cy="64" r="26" fill="none" stroke="#c19a45" stroke-width="3.2"/>
    <!-- LA FUSION : moitié pion, moitié créature, séparées par la fêlure. La
         moitié créature est en menthe CLAIRE et non en vert-de-gris : à la
         couleur du bouillon, elle s'y noyait purement et simplement. -->
    <g transform="translate(50 68) scale(1.2) translate(-50 -68)">
      <path d="M50 46c-4 0-7 2.6-7 6 0 1.8.9 3.4 2.3 4.4-3.5 2.6-6 6.6-7.3 11.6H50z" fill="#e6c576"/>
      <path d="M50 46c4.6 0 7.6 3.2 6.8 7.2 2 1.2 3.6 3 4.6 5.2l3.4-6.4 1.4 8.6c.4 3 .2 5.6-.6 7.4H50z" fill="#5fe0c6"/>
      <path d="M50 44l-3.2 11h5.4L49 68" fill="none" stroke="#fff" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    </g>
    <!-- Le bouillon d'où sort la pièce : segment circulaire sous la corde y=68. -->
    <path d="M24.3 68A26 26 0 0 0 75.7 68Z" fill="#2fb197"/>
    <circle cx="41" cy="80" r="3" fill="#e6c576"/>
    <circle cx="60" cy="76" r="2.2" fill="#e6c576" opacity=".7"/>
  </g>
</svg>
