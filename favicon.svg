<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Epic Chess">
  <!-- Fiole d'alchimiste. Couleurs reprises des variables de css/style.css :
       fond #1d1a10, laiton #bd9548, potion #6fae44, reflets #e0bc63.
       Format SVG pour rester net à toutes les tailles d'onglet et de favori. -->
  <rect width="64" height="64" rx="14" fill="#1d1a10"/>
  <!-- Col de la fiole -->
  <path d="M26 12h12v3h-2v9.5l10.8 19.7A9 9 0 0 1 39 58H25a9 9 0 0 1-7.8-13.8L28 24.5V15h-2z"
        fill="none" stroke="#bd9548" stroke-width="3" stroke-linejoin="round"/>
  <!-- Liquide phosphorescent -->
  <path d="M21.2 42h21.6l3.8 6.9A7 7 0 0 1 39 55H25a7 7 0 0 1-6.6-9.6z" fill="#6fae44"/>
  <!-- Bulles -->
  <circle cx="28" cy="47" r="2.4" fill="#e0bc63"/>
  <circle cx="36" cy="50" r="1.6" fill="#e0bc63" opacity=".75"/>
</svg>
