<?xml version="1.0" encoding="UTF-8"?>
<!-- ================================================================
     RANGEE-PRISES.SVG : les alvéoles des pièces prises
     ================================================================
     Six alvéoles carrées cerclées d'or. Ce qu'on y dépose, ce sont les SVG
     monochromes du plateau en petit (js/piece-art.js) — surtout pas les
     illustrations de cartes, qui sont des portraits en 2/3 et ne tiennent pas
     dans un carré.

     POURQUOI CETTE PLANCHE SE RÉPÈTE AU LIEU DE S'ÉTIRER. Le nombre de pièces
     prises va de zéro à seize : la rangée n'a donc pas de largeur fixe. Étirée,
     six alvéoles deviendraient six rectangles de plus en plus larges. Posée en
     fond RÉPÉTÉ horizontalement à hauteur fixe (`background-repeat:repeat-x`,
     `background-size:auto 100%`), l'alvéole garde toujours exactement la même
     taille, et la rangée en montre autant qu'elle a de place. C'est la
     deuxième façon, avec border-image, de ne jamais déformer un ornement.

     Le motif fait donc UNE alvéole de large, pas six : c'est la répétition
     qui fait les six.
     ================================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" width="26" height="26" color="#c9a84c">
  <title>Epic Chess, alvéole de pièce prise</title>
  <rect x="1.6" y="1.6" width="22.8" height="22.8" rx="4" fill="#0b1220" fill-opacity=".35"/>
  <rect x="1.6" y="1.6" width="22.8" height="22.8" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>
  <!-- Quatre encoches d'angle : sans elles, une file d'alvéoles se lit comme
       une grille de tableur. Avec, chaque case redevient une loge. -->
  <g stroke="#e6cd86" stroke-width=".8" opacity=".45" stroke-linecap="round">
    <path d="M4.4 1.6 H7 M1.6 4.4 V7 M19 1.6 H21.6 M24.4 4.4 V7"/>
    <path d="M4.4 24.4 H7 M1.6 21.6 V19 M19 24.4 H21.6 M24.4 21.6 V19"/>
  </g>
</svg>
