<?xml version="1.0" encoding="UTF-8"?>
<!-- ================================================================
     ICONES.SVG : les cinq pictogrammes du jeu, dans un seul fichier
     ================================================================
     Sablier, épées croisées, parchemin, drapeau, roue des réglages. Ils
     s'appellent par `<use href="#ec-sablier">` et prennent la couleur de leur
     porteur (tout est en `currentColor`).

     ELLES DESCENDENT À 18 PX, et c'est la seule contrainte qui commande leur
     dessin. D'où : TRAIT PLEIN, jamais de dégradé (un dégradé sur dix-huit
     pixels devient une tache) ; jamais de détail plus fin qu'une unité et
     demie de la grille de 24 (en dessous, le trait s'efface une fois sur
     deux selon l'arrondi du navigateur) ; et une silhouette qui se
     reconnaît les yeux plissés — c'est elle qu'on lit à cette taille, pas
     l'intérieur.

     ────────────────────────────────────────────────────────────────
     CE FICHIER EST RECOPIÉ DANS index.html, ET C'EST VOULU.
     ────────────────────────────────────────────────────────────────
     `<use href="icones.svg#ec-sablier">` ne fonctionne PAS : tous les
     navigateurs refusent qu'un <use> pointe vers un AUTRE document, par
     sécurité. Les deux façons de contourner coûtent chacune quelque chose :
     aller chercher le fichier en JavaScript fait apparaître les icônes après
     le premier rendu (donc un clignotement, exactement ce qu'on vient de
     retirer de la page d'armées), et le jeu n'a AUCUNE étape de construction
     qui pourrait recopier ce fichier automatiquement.

     Les cinq <symbol> sont donc AUSSI écrits en tête de <body> dans
     index.html, où `<use href="#ec-…">` marche dans le même document, sans
     requête et sans clignotement. Ce fichier reste la SOURCE : on le corrige
     ici, on recopie là-bas. Et pour que « on recopie » ne reste pas une
     promesse, tools/smoke-test.js compare les deux et échoue s'ils divergent.
     ================================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="display:none">
  <title>Epic Chess, pictogrammes d'interface</title>

  <!-- LE SABLIER : la pendule. Deux triangles qui se touchent par la pointe,
       et non un vrai sablier galbé — la courbe se perd, l'angle non. -->
  <symbol id="ec-sablier" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h12M6 22h12"/>
      <path d="M7 2v3.2c0 2 1.3 3.6 5 6.8 3.7-3.2 5-4.8 5-6.8V2"/>
      <path d="M7 22v-3.2c0-2 1.3-3.6 5-6.8 3.7 3.2 5 4.8 5 6.8V22"/>
    </g>
  </symbol>

  <!-- LES ÉPÉES CROISÉES : le combat. Les deux lames pointent vers le HAUT,
       poignées en bas : c'est le seul agencement où l'on distingue encore la
       lame de la garde à dix-huit pixels. Le croisement est placé au tiers
       supérieur — croisées au centre, les deux lames font une croix, et une
       croix ne dit pas « duel ». Les trois traits courts de chaque poignée
       (pommeau, garde, fusée) sont à la limite de ce qui tient : en dessous de
       deux unités, ils s'effacent une fois sur deux selon l'arrondi. -->
  <symbol id="ec-epees" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 17.5 3 6V3h3l11.5 11.5"/>
      <path d="M13 19 19 13"/><path d="M16 16 20 20"/><path d="M19 21 21 19"/>
      <path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/>
      <path d="M5 14 9 18"/><path d="M7 17 4 20"/><path d="M3 19 5 21"/>
    </g>
  </symbol>

  <!-- LE PARCHEMIN : le journal des coups. Un rouleau, donc un enroulement
       visible en haut ET en bas — sans les deux, c'est une feuille. -->
  <symbol id="ec-parchemin" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6"/>
      <path d="M6 3a2 2 0 0 0-2 2 2 2 0 0 0 2 2h2"/>
      <path d="M6 21a2 2 0 0 1-2-2 2 2 0 0 1 2-2h2"/>
      <path d="M10 8h7M10 12h7M10 16h4"/>
    </g>
  </symbol>

  <!-- LE DRAPEAU : abandonner. Hampe à gauche, pan qui retombe : c'est le pan
       retombant qui dit la reddition plutôt que la conquête. -->
  <symbol id="ec-drapeau" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 22V3"/>
      <path d="M5 4h11l-2.2 4L16 12H5z"/>
    </g>
  </symbol>

  <!-- LA ROUE DES RÉGLAGES. Huit dents, et leur géométrie est CALCULÉE pour
       rester nette à vingt pixels : dents à r=10,6, pied à r=7,7, moyeu percé
       à r=4,3 par fill-rule="evenodd". C'est le même rouage que le bouton de
       réglages du menu (#settings-btn), et c'est exprès : deux rouages
       différents dans la même interface se lisent comme deux réglages
       différents. -->
  <symbol id="ec-reglages" viewBox="0 0 24 24">
    <path fill="currentColor" fill-rule="evenodd" d="M10.01 4.56 10.16 1.56h3.68l.15 3A7.7 7.7 0 0 1 15.85 5.33L18.08 3.32l2.6 2.6-2.01 2.23a7.7 7.7 0 0 1 .77 1.86l3 .15v3.68l-3 .15a7.7 7.7 0 0 1-.77 1.86l2.01 2.23-2.6 2.6-2.23-2.01a7.7 7.7 0 0 1-1.86.77l-.15 3h-3.68l-.15-3a7.7 7.7 0 0 1-1.86-.77L5.92 20.68l-2.6-2.6 2.01-2.23a7.7 7.7 0 0 1-.77-1.86l-3-.15v-3.68l3-.15a7.7 7.7 0 0 1 .77-1.86L3.32 5.92l2.6-2.6 2.23 2.01a7.7 7.7 0 0 1 1.86-.77ZM12 7.7a4.3 4.3 0 1 0 0 8.6 4.3 4.3 0 0 0 0-8.6Z"/>
  </symbol>
</svg>
