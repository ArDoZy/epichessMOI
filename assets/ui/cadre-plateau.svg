<?xml version="1.0" encoding="UTF-8"?>
<!-- ================================================================
     CADRE-PLATEAU.SVG : l'encadrement de l'échiquier
     ================================================================
     C'EST LA PLANCHE QUI JUSTIFIE À ELLE SEULE LE CHOIX DU VECTORIEL. Le
     plateau est un carré dont le côté dépend de la hauteur disponible : 320 px
     sur un téléphone tenu à la main, 640 px sur un bureau, et toutes les
     valeurs entre les deux. Une image de cadre devrait être étirée dans les
     deux sens à la fois — ses fleurons de coin s'ovaliseraient à chaque
     taille, différemment.

     En `border-image` (voir [ART] dans css/style.css), les quatre coins sont
     découpés et posés À TAILLE FIXE, et seuls les quatre bords s'étirent.
     Comme ces bords ne portent que des filets parallèles à leur propre
     étirement, il n'y a rien à déformer : le cadre suit le plateau sans
     jamais écraser un seul ornement.

     LA BANDE EST PLEINE (v2). La première version ne dessinait que deux
     filets dans un carré de 200 unités : ramenés à 11 px à l'écran, ils ne
     faisaient plus que 0,3 px — le cadre était là et ne se voyait pas. Toute
     la bordure (les 46 unités que découpe border-image-slice) est maintenant
     peinte : un liseré sombre, un jonc d'or, une bande de bronze filetée, un
     second jonc, et l'ombre portée contre les cases. Chaque bande est un
     anneau carré (tracé en `evenodd`), donc parallèle à son bord : l'étirement
     ne déforme rien.

     LE CENTRE EST TRANSPARENT, et c'est vital : on joue au travers. C'est
     `border-image-slice` SANS le mot-clé `fill` qui le garantit — avec lui,
     la région centrale serait peinte par-dessus l'échiquier.
     ================================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Epic Chess, cadre de l'échiquier</title>
  <defs>
    <!-- Les dégradés sont radiaux et centrés : ils éclairent les quatre bords
         de la même façon, ce qu'un dégradé linéaire ne ferait que pour deux. -->
    <radialGradient id="jonc" cx="100" cy="100" r="100" gradientUnits="userSpaceOnUse">
      <stop offset=".90" stop-color="#b08a3a"/><stop offset=".95" stop-color="#f3dc98"/><stop offset="1" stop-color="#9a7430"/>
    </radialGradient>
    <radialGradient id="jonc2" cx="100" cy="100" r="100" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#e8cd84"/><stop offset=".8" stop-color="#b8923f"/>
    </radialGradient>
    <radialGradient id="bronze" cx="100" cy="100" r="100" gradientUnits="userSpaceOnUse">
      <stop offset=".6" stop-color="#20170b"/><stop offset=".85" stop-color="#3b2b14"/><stop offset="1" stop-color="#2a1f0f"/>
    </radialGradient>
    <!-- Le fleuron d'angle : un losange d'or serti, contenu dans le carré de
         46 unités. C'est le plus petit motif qui reste lisible à 11 px. -->
    <g id="fleuron">
      <path d="M23 7 39 23 23 39 7 23Z" fill="#140e05"/>
      <path d="M23 10 36 23 23 36 10 23Z" fill="url(#jonc2)"/>
      <path d="M23 16 30 23 23 30 16 23Z" fill="#20170b"/>
      <circle cx="23" cy="23" r="3.2" fill="#f3dc98"/>
    </g>
  </defs>
  <path fill-rule="evenodd" fill="#140e05" d="M0 0H200V200H0Z M3 3V197H197V3Z"/>
  <path fill-rule="evenodd" fill="url(#jonc)" d="M3 3H197V197H3Z M9 9V191H191V9Z"/>
  <path fill-rule="evenodd" fill="#7a5b22" d="M9 9H191V191H9Z M12 12V188H188V12Z"/>
  <path fill-rule="evenodd" fill="url(#bronze)" d="M12 12H188V188H12Z M40 40V160H160V40Z"/>
  <path fill-rule="evenodd" fill="url(#jonc2)" d="M40 40H160V160H40Z M44 44V156H156V44Z"/>
  <path fill-rule="evenodd" fill="#0b0906" d="M44 44H156V156H44Z M46 46V154H154V46Z"/>
  <!-- Le filet qui court au milieu de la bande de bronze. -->
  <path fill-rule="evenodd" fill="#c9a84c" opacity=".55" d="M25.4 25.4H174.6V174.6H25.4Z M26.6 26.6V173.4H173.4V26.6Z"/>
  <use href="#fleuron"/>
  <use href="#fleuron" transform="translate(154,0)"/>
  <use href="#fleuron" transform="translate(0,154)"/>
  <use href="#fleuron" transform="translate(154,154)"/>
</svg>
