<g mask="url(#mL)"><rect width="800" height="800" fill="#e2c069"/><rect width="800" height="800" fill="url(#lgL)"/><rect width="800" height="800" filter="url(#gH)" opacity="0.3" style="mix-blend-mode:overlay"/></g>
<g mask="url(#mD)"><rect width="800" height="800" fill="#9c7020"/><rect width="800" height="800" fill="url(#lgD)"/><rect width="800" height="800" filter="url(#gV)" opacity="0.3" style="mix-blend-mode:overlay"/></g>
<rect width="800" height="800" fill="url(#grid)"/>
<rect width="800" height="800" fill="url(#vig)"/>
