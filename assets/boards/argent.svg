<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" shape-rendering="crispEdges">
<title>Epic Chess, echiquier argent</title>
<defs><pattern id="pL" width="200" height="200" patternUnits="userSpaceOnUse"><rect width="200" height="200" fill="#000"/><rect x="0" y="0" width="100" height="100" fill="#fff"/><rect x="100" y="100" width="100" height="100" fill="#fff"/></pattern><pattern id="pD" width="200" height="200" patternUnits="userSpaceOnUse"><rect width="200" height="200" fill="#000"/><rect x="100" y="0" width="100" height="100" fill="#fff"/><rect x="0" y="100" width="100" height="100" fill="#fff"/></pattern><mask id="mL"><rect width="800" height="800" fill="url(#pL)"/></mask><mask id="mD"><rect width="800" height="800" fill="url(#pD)"/></mask><filter id="gH" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="1.2 0.003" numOctaves="2" seed="45" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1"/></feComponentTransfer></filter><filter id="gV" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.003 1.2" numOctaves="2" seed="45" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1"/></feComponentTransfer></filter><linearGradient id="lgL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f7f9" stop-opacity=".85"/><stop offset="1" stop-color="#c0c6cc" stop-opacity=".85"/></linearGradient><linearGradient id="lgD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#949da4" stop-opacity=".85"/><stop offset="1" stop-color="#5e666d" stop-opacity=".85"/></linearGradient><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0V100M0 100H100" fill="none" stroke="rgba(40,48,56,.45)" stroke-width="1.4"/></pattern><radialGradient id="vig" cx="50%" cy="42%" r="72%"><stop offset="0" stop-color="#fff" stop-opacity="0.3"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/></radialGradient></defs>
<g mask="url(#mL)"><rect width="800" height="800" fill="#dee2e6"/><rect width="800" height="800" fill="url(#lgL)"/><rect width="800" height="800" filter="url(#gH)" opacity="0.26" style="mix-blend-mode:overlay"/></g>
<g mask="url(#mD)"><rect width="800" height="800" fill="#7e878f"/><rect width="800" height="800" fill="url(#lgD)"/><rect width="800" height="800" filter="url(#gV)" opacity="0.26" style="mix-blend-mode:overlay"/></g>
<rect width="800" height="800" fill="url(#grid)"/>
<rect width="800" height="800" fill="url(#vig)"/>
</svg>
