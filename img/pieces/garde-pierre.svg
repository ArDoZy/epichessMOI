<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     class="gp-piece" role="img" aria-labelledby="gp-title">
  <title id="gp-title">Garde de Pierre</title>

  <!--
    Garde de Pierre (classe Brute) : sentinelle de roche casquée, posée sur
    son socle. Gravure héraldique, noir et blanc uniquement comme le reste
    des pièces.

    Camp blanc (défaut) : intérieur blanc, traits noirs.
    Camp noir : poser l'attribut data-camp="noir" sur la balise svg ci
    dessus. Les deux couleurs sont alors exactement inversées, intérieur
    noir et traits blancs.

    Les couleurs passent par les variables CSS déclarées dans le bloc style
    ci dessous. Une page hôte peut les redéfinir sans toucher au fichier, et
    le SVG reste utilisable tel quel en balise img (il tombe alors sur les
    valeurs par défaut, donc sur le camp blanc).

    ATTENTION si tu édites ce fichier : un commentaire XML ne peut pas
    contenir deux tirets à la suite. Les noms de variables CSS commencent
    justement par deux tirets, donc ne jamais les citer dans un commentaire.

    Proportions relevées sur le visuel de référence, en fraction de la
    largeur totale : socle 1.00, base du tronc 0.80, épaules 0.70, base du
    casque 0.50, sommet du casque 0.32. En hauteur : casque sur les 27 %
    hauts, tronc jusqu'à 83 %, socle sur le reste. L'ordre de tracé compte,
    chaque pièce recouvre la précédente : tronc, puis casque (qui masque
    l'arête haute du tronc et dessine ainsi les épaules), puis socle (qui
    masque le pied du tronc).
  -->

  <style>
    .gp-piece{
      --_fill:   var(--gp-fill,   #ffffff);
      --_stroke: var(--gp-stroke, #000000);
    }
    .gp-piece[data-camp="noir"]{
      --_fill:   var(--gp-fill-noir,   #000000);
      --_stroke: var(--gp-stroke-noir, #ffffff);
    }
    .gp-shape{ fill: var(--_fill); stroke: var(--_stroke); stroke-width: 4.2; stroke-linejoin: round; }
    .gp-carve{ fill: var(--_stroke); }
    .gp-inlay{ fill: none; stroke: var(--_stroke); stroke-width: 2.4; stroke-linejoin: round; }
  </style>

  <!-- Tronc : trapèze évasé, avec une cassure d'angle à mi hauteur sur
       chaque flanc. Son pied descend sous le socle, qui le recouvrira.
       Les deux points 40 38.5 et 91.3 33.9 de son arête haute sont aussi
       les deux coins bas du casque : les deux contours se superposent donc
       exactement, et les épaules se fondent dans le casque au lieu de
       former une marche. Déplacer un coin du casque impose de déplacer le
       point correspondant ici. -->
  <path class="gp-shape"
        d="M24.6 42.2 L40 38.5 L91.3 33.9 L102.1 42.8 L105.8 74.7 L108.5 108 L19.5 108 L21.6 74.7 Z"/>

  <!-- Éclats du tronc : des aplats pleins, jamais des traits. Une pointe
       pleine reste franche à toutes les tailles, un trait fin se referme. -->
  <g class="gp-carve">
    <!-- Deux écornures mordant l'arête gauche -->
    <path d="M24.43 43.5 L23.7 50.5 L42.3 52.1 Z"/>
    <path d="M21.9 71.5 L21.35 78.5 L37.8 79.4 Z"/>
    <!-- Une écornure mordant l'arête droite -->
    <path d="M102.45 45.5 L103.35 53.5 L81.4 56 Z"/>
    <!-- Fissure maîtresse : ruban coudé, effilé à ses deux pointes et large
         au coude, qui traverse le tronc en diagonale. -->
    <path d="M53.2 89.6 L75.4 56.9 L97.9 74.3 L78.6 61 Z"/>
    <!-- Éclat isolé sous le bras droit de la fissure -->
    <path d="M84.2 79.4 L87.6 81.8 L83.3 94.7 Z"/>
  </g>

  <!-- Casque : bloc hexagonal évasé vers le bas, légèrement incliné vers la
       droite. Tracé après le tronc, dont il recouvre l'arête haute. -->
  <path class="gp-shape" d="M37.8 11.3 L73.3 7.6 L91.3 33.9 L40 38.5 L32.9 16.3 Z"/>

  <!-- Fente de visée : le seul aplat du casque, et tout le regard de la
       pièce. Large et basse, comme sur la référence. -->
  <path class="gp-carve" d="M46.6 24.1 L78.5 22.4 L78.9 30.2 L46.9 31.7 Z"/>

  <!-- Socle : dalle tracée en dernier, devant le pied du tronc. -->
  <path class="gp-shape" d="M9 122 L119 122 L115.6 102.9 L11.8 102.9 Z"/>
  <!-- Filet gravé en retrait dans la dalle, pour le relief héraldique. Son
       retrait doit laisser au moins 1.5 de blanc franc avec le contour de
       la dalle, sinon les deux traits fusionnent en un seul bandeau noir et
       le relief disparaît. -->
  <path class="gp-inlay" d="M17 117 L111 117 L108.5 108.5 L19.5 108.5 Z"/>
</svg>
