<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Coffres qu'on brise — banc d'essai de la destruction</title>

<!--
  BANC D'ESSAI DU COFFRE QU'ON BRISE
  =================================================================
  Cette page ne fait PAS partie du jeu : rien dans index.html ne la
  charge. Elle joue la séquence de destruction d'un coffre avec le VRAI
  moteur (js/chest-break.js) et le VRAI décor (css/style.css), hors du
  jeu — pour régler le rythme sans devoir gagner un coffre à chaque
  essai.

  Deux usages :

  1. Les planches sont déjà dans assets/chests/<id>/ (les cinq de la
     pièce) et assets/chests/forall/ (les trois communes) : la page les
     prend telles quelles.
  2. Elles n'y sont pas encore : la page dessine des planches
     d'approximation au canevas (une pièce blanche, des fissures dorées,
     une explosion) pour qu'on puisse juger le rythme tout de suite. On
     peut aussi DÉPOSER ses images sur la page — rien n'est copié dans le
     dépôt, tout se joue dans le navigateur.

  Le réglage lui-même (secousses, halo, durées) est dans la table
  CHEST_BREAK, en tête de js/chest-break.js.

  Ouvrir :  npm run dev   puis   /tools/chest-break-preview.html
            ?chest=cavalier   pour régler le Cavalier plutôt que le Pion
  (le protocole file:// bloque le chargement des images, il faut un
  serveur — celui de `npm run dev` suffit)
-->

<link rel="stylesheet" href="../css/style.css">
<style>
  body{margin:0;background:#05070a}
  .pv-bar{position:fixed;left:0;right:0;bottom:0;z-index:9999;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    padding:12px 14px;background:rgba(10,14,18,.94);border-top:1px solid rgba(255,255,255,.1);
    font-family:system-ui,sans-serif;font-size:12.5px;color:#9fb0bd}
  .pv-bar button{font:inherit;font-weight:700;cursor:pointer;padding:8px 16px;border-radius:9px;
    border:1px solid rgba(217,182,78,.5);background:rgba(217,182,78,.13);color:#e5c76a}
  .pv-bar button:hover{background:rgba(217,182,78,.24)}
  .pv-bar label{cursor:pointer;text-decoration:underline dotted}
  .pv-bar input[type=file]{display:none}
  .pv-src{color:#6f8091;font-style:italic}
  .chest-modal{background:rgba(4,7,9,.98);padding-bottom:80px}
</style>
</head>
<body>

<div class="chest-modal show pb-cinema" id="chest-modal">
  <div class="chest-stage">
    <div class="pbreak" id="chest-break" hidden></div>
    <div class="chest-title" id="chest-title">Coffre Pion</div>
    <div class="chest-hint" id="chest-hint"></div>
    <div class="chest-loot" id="chest-loot"></div>
  </div>
</div>

<div class="pv-bar">
  <button id="pv-replay">Rejouer</button>
  <button id="pv-swap">Autre coffre</button>
  <label>Utiliser mes images<input type="file" id="pv-files" accept="image/*" multiple></label>
  <span class="pv-src" id="pv-src">…</span>
</div>

<script src="../js/chest-break.js"></script>
<script>
// Quel coffre règle-t-on ? ?chest=cavalier pour le Cavalier, le Pion sinon.
// Le bouton « Autre coffre » recharge la page sur l'autre séquence : le
// moteur monte une scène par séquence, on ne les mélange pas à chaud.
const IDS=Object.keys(CHEST_BREAK);
const CHEST=IDS.indexOf(new URLSearchParams(location.search).get('chest'))>=0
  ?new URLSearchParams(location.search).get('chest'):IDS[0];
const CFG=CHEST_BREAK[CHEST];

// Les dossiers sont relatifs à index.html : depuis tools/, il faut remonter
// d'un cran. On les remonte TOUS, pas seulement ceux du coffre réglé :
// chestBreakPreload (js/chest-break.js) va chercher la première planche de
// chaque coffre au démarrage, et laisser les autres chemins tels quels ne
// donnerait rien de plus qu'une paire de 404 dans la console.
IDS.forEach(id=>{
  const c=CHEST_BREAK[id];
  c.dir='../'+c.dir;
  c.stages.forEach(st=>{if(st.dir)st.dir='../'+st.dir;});
});

document.getElementById('chest-title').textContent=
  'Coffre '+CHEST.charAt(0).toUpperCase()+CHEST.slice(1);
document.getElementById('pv-swap').addEventListener('click',()=>{
  location.search='?chest='+IDS[(IDS.indexOf(CHEST)+1)%IDS.length];
});

const STAGES=CFG.stages;
const NAMES=STAGES.map(s=>s.src);
const srcLabel=document.getElementById('pv-src');
let seq=null;

// ----------------------------------------------------------------
// PLANCHES D'APPROXIMATION
// ----------------------------------------------------------------
// Dessinées au canevas, et volontairement grossières : elles ne servent
// qu'à juger le RYTHME (combien de temps tient une frappe, à quel moment
// le tremblement devient inquiétant, si l'explosion arrive trop vite).
// Elles partagent le seul point qui compte avec les vraies : un cadrage
// rigoureusement identique d'une planche à l'autre.
const W=512,H=683;
function rng(seed){let s=seed>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296);}

function beam(g){
  const gr=g.createLinearGradient(W/2,0,W/2,H*0.8);
  gr.addColorStop(0,'rgba(226,238,248,.30)');gr.addColorStop(1,'rgba(226,238,248,0)');
  g.fillStyle=gr;
  g.beginPath();g.moveTo(W*0.44,0);g.lineTo(W*0.56,0);
  g.lineTo(W*0.70,H*0.82);g.lineTo(W*0.30,H*0.82);g.closePath();g.fill();
}
function podium(g){
  [[0.46,0.060,'#0e1319',H*0.905],[0.40,0.052,'#171d25',H*0.862]].forEach(([rx,ry,col,cy])=>{
    g.beginPath();g.ellipse(W/2,cy,W*rx,H*ry,0,0,7);
    g.fillStyle=col;g.fill();
    g.strokeStyle='rgba(150,170,190,.20)';g.lineWidth=2;g.stroke();
  });
}
function pawnPath(g){
  const cx=W/2;
  g.beginPath();
  g.moveTo(cx-W*0.170,H*0.815);
  g.lineTo(cx-W*0.150,H*0.775);
  g.quadraticCurveTo(cx-W*0.130,H*0.700,cx-W*0.070,H*0.640);
  g.quadraticCurveTo(cx-W*0.040,H*0.590,cx-W*0.048,H*0.552);
  g.lineTo(cx+W*0.048,H*0.552);
  g.quadraticCurveTo(cx+W*0.040,H*0.590,cx+W*0.070,H*0.640);
  g.quadraticCurveTo(cx+W*0.130,H*0.700,cx+W*0.150,H*0.775);
  g.lineTo(cx+W*0.170,H*0.815);
  g.closePath();
}
function pawn(g){
  const cx=W/2,gr=g.createLinearGradient(cx-W*0.17,0,cx+W*0.17,0);
  gr.addColorStop(0,'#c9c6bd');gr.addColorStop(.35,'#f4f1e8');gr.addColorStop(1,'#b8b5ac');
  g.fillStyle=gr;
  pawnPath(g);g.fill();
  g.beginPath();g.ellipse(cx,H*0.545,W*0.085,H*0.016,0,0,7);g.fill();   // collerette
  g.beginPath();g.arc(cx,H*0.462,W*0.085,0,7);g.fill();                 // tête
}
// Une fissure : une marche aléatoire vers le bas, avec des embranchements.
// Le tirage est SEMÉ, donc la fissure n°3 est la même à tous les niveaux :
// chaque planche contient les précédentes, comme les vraies images.
function crack(g,r,x,y,len,wid){
  g.beginPath();g.moveTo(x,y);
  let a=Math.PI/2+(r()-.5)*0.9;
  for(let i=0;i<len;i++){
    a+=(r()-.5)*0.85;
    x+=Math.cos(a)*11;y+=Math.sin(a)*11;
    g.lineTo(x,y);
  }
  g.lineWidth=wid;g.lineCap='round';
  g.strokeStyle='#fff3cf';g.shadowColor='#ffb43c';g.shadowBlur=22;g.stroke();
  g.shadowBlur=9;g.strokeStyle='rgba(255,214,120,.9)';g.lineWidth=wid*2.4;g.stroke();
  g.shadowBlur=0;
}
function cracks(g,n){
  const r=rng(7);
  g.save();
  pawnPath(g);g.clip();                       // les fissures restent dans la pièce
  g.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    crack(g,r,W/2+(r()-.5)*W*0.16,H*(0.44+r()*0.10),9+((r()*7)|0),1.6);
  }
  g.restore();
}
function shards(g,n,spread,size){
  const r=rng(19);
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const a=r()*7,d=(0.15+r()*spread)*W,
          x=W/2+Math.cos(a)*d,y=H*0.60+Math.sin(a)*d*1.15,s=size*(0.4+r());
    g.beginPath();
    for(let k=0;k<5;k++){
      const t=k/5*7,rr=s*(0.6+r()*0.7);
      g[k?'lineTo':'moveTo'](x+Math.cos(t)*rr,y+Math.sin(t)*rr);
    }
    g.closePath();
    g.fillStyle='#efece2';g.shadowColor='#ffbe4e';g.shadowBlur=26;g.fill();
  }
  g.restore();
}
function core(g,power){
  const gr=g.createRadialGradient(W/2,H*0.60,0,W/2,H*0.60,W*power);
  gr.addColorStop(0,'rgba(255,253,244,'+Math.min(1,power*1.8)+')');
  gr.addColorStop(.30,'rgba(255,219,130,'+(power*1.1)+')');
  gr.addColorStop(.62,'rgba(236,163,54,'+(power*0.45)+')');
  gr.addColorStop(1,'rgba(120,70,10,0)');
  g.save();g.globalCompositeOperation='lighter';
  g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore();
}

function placeholder(i){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#05070a';g.fillRect(0,0,W,H);
  beam(g);podium(g);
  if(i<=3){ pawn(g); if(i)cracks(g,[0,1,5,14][i]); if(i)core(g,i*0.10); }
  else if(i===4){ pawn(g);cracks(g,22);shards(g,16,0.55,17);core(g,0.55); }
  else if(i===5){ shards(g,26,0.85,13);core(g,1.05); }        // l'éclatement
  else if(i===6){ shards(g,34,1.20,11);core(g,1.70); }        // plein cadre
  return c.toDataURL('image/png');   // i===7 : le socle seul
}

// ----------------------------------------------------------------
// Une fausse carte de lot, pour juger la composition finale : la récompense
// doit flotter EN L'AIR au milieu du socle vide, pas s'empiler sous la
// scène. C'est la vraie carte du jeu (.loot-reveal), avec le vrai habillage
// de cinéma — seul son contenu est simulé.
function fakeLoot(n,total){
  document.getElementById('chest-loot').innerHTML=
    '<div class="chest-loot-count">'+n+' / '+total+'</div>'+
    '<div class="loot loot-reveal"><div class="pc-icon" style="width:72px;height:72px;margin:0 auto;'+
      'border-radius:50%;background:radial-gradient(circle at 40% 35%,#f6f2e6,#8e9299)"></div>'+
    '<div class="loot-name">Lot d\'exemple</div><div class="loot-qty">+'+(n*3)+'</div></div>';
  document.getElementById('chest-hint').textContent=
    n<total?'Cliquez pour continuer':'Cliquez pour tout récupérer';
}
let lootN=0;
const LOOT_TOTAL=3;
function play(){
  if(seq)seq.destroy();
  lootN=0;
  document.getElementById('chest-loot').innerHTML='';
  document.getElementById('chest-modal').classList.remove('opening');
  seq=chestBreakMount(CHEST,()=>{
    document.getElementById('chest-modal').classList.add('opening');
    fakeLoot(++lootN,LOOT_TOTAL);
  });
}
function useSources(srcs,label){
  CFG.dir='';
  srcs.forEach((s,i)=>{STAGES[i].src=s;});
  srcLabel.textContent=label;
  play();
}

// Une frappe tant que la pièce tient ; ensuite, le même clic fait défiler
// les lots — c'est exactement l'enchaînement de chestCeremonyAdvance.
document.getElementById('chest-break').addEventListener('click',()=>{
  if(!seq)return;
  if(lootN)fakeLoot(lootN<LOOT_TOTAL?++lootN:(lootN=1),LOOT_TOTAL);
  else if(!seq.busy())seq.next();
});
document.getElementById('pv-replay').addEventListener('click',play);

// Les images déposées à la main : triées par nom de fichier, dans l'ordre des
// étapes — les cinq de la pièce PUIS les trois communes. C'est pour ça que
// les noms sont numérotés de 01 à 08 d'un dossier à l'autre.
document.getElementById('pv-files').addEventListener('change',e=>{
  const f=[].slice.call(e.target.files).sort((a,b)=>a.name.localeCompare(b.name));
  if(f.length!==STAGES.length){
    srcLabel.textContent='Il en faut exactement '+STAGES.length+' (reçu '+f.length+').';
    return;
  }
  useSources(f.map(x=>URL.createObjectURL(x)),f.length+' images déposées');
});

// Les vraies images d'abord ; les approximations seulement si elles
// manquent — la page doit montrer quelque chose dans tous les cas.
const probe=new Image();
probe.onload=()=>{srcLabel.textContent='assets/chests/'+CHEST+'/ — vraies images';play();};
probe.onerror=()=>useSources(STAGES.map((s,i)=>placeholder(i)),
  'approximations dessinées (assets/chests/'+CHEST+'/ est vide) — attendus : '+NAMES.join(', '));
probe.src=CFG.dir+NAMES[0];
</script>
</body>
</html>
