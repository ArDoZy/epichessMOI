# ================================================================
# ANTI-MISE EN VEILLE DU PROJET SUPABASE
# ================================================================
# Un projet Supabase du plan gratuit s'endort après 7 jours sans activité.
# Quand il dort, le WebSocket Realtime ne répond plus et le multijoueur du
# jeu tombe : c'est exactement ce qui est arrivé, et personne ne peut le
# deviner depuis le jeu.
#
# Ce workflow appelle simplement l'API REST du projet une fois par jour, ce
# qui réarme le compteur d'inactivité.
#
# CE N'EST PAS UNE GARANTIE : c'est un contournement qui repose sur le fait
# qu'une requête compte comme de l'activité. Si Supabase change ses critères
# de mise en veille, il faudra revoir. La seule solution qui supprime
# vraiment le risque est le plan Pro.
#
# ----------------------------------------------------------------
# CONFIGURATION (à faire une fois)
# ----------------------------------------------------------------
# Ce workflow lit deux secrets de dépôt. Réglages > Secrets and variables >
# Actions > New repository secret :
#
#   SUPABASE_URL  = https://xxxxxxxxxxxx.supabase.co
#                   (Supabase > Settings > API > Project URL)
#   SUPABASE_KEY  = la clé PUBLIABLE (publishable / anon), jamais la secrète
#
# La clé publiable vit déjà en clair dans js/multiplayer.js, elle est faite
# pour ça. On passe malgré tout par un secret pour ne pas avoir à modifier
# le workflow le jour où le projet change.
#
# ----------------------------------------------------------------
# ATTENTION : GitHub désactive les workflows planifiés d'un dépôt public
# resté 60 jours sans commit. Si le jeu n'évolue plus pendant deux mois,
# revenez ici cliquer sur « Enable workflow ».
# ================================================================

name: Reveiller Supabase

on:
  schedule:
    # Tous les jours à 6h12 UTC. Une heure « en biais » plutôt que pile :
    # les workflows planifiés à des heures rondes sont mis en file par
    # GitHub et peuvent partir avec beaucoup de retard.
    - cron: '12 6 * * *'
  # Permet aussi de le lancer à la main depuis l'onglet Actions, utile juste
  # après avoir réveillé le projet pour vérifier que la clé répond.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'API REST du projet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "Les secrets SUPABASE_URL et SUPABASE_KEY ne sont pas definis."
            echo "Voir l'en-tete de ce fichier pour la marche a suivre."
            exit 1
          fi

          # -m 30 : un projet en cours de reveil peut mettre plusieurs
          # secondes a repondre, mais on ne veut pas bloquer le runner.
          code=$(curl -sS -o /tmp/rep.txt -w '%{http_code}' -m 30 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/" || echo "000")

          echo "HTTP ${code}"
          head -c 400 /tmp/rep.txt || true
          echo

          case "${code}" in
            # 2xx et 404 signifient tous deux que le projet a REPONDU, ce qui
            # est tout ce qui nous interesse : le compteur d'inactivite est
            # rearme. Un 404 sur /rest/v1/ est normal quand aucune table
            # n'est exposee, et ce jeu n'en utilise aucune.
            2*|404) echo "Projet eveille." ;;
            401|403) echo "Le projet repond mais refuse la cle. Verifiez le secret SUPABASE_KEY."; exit 1 ;;
            000) echo "Aucune reponse du projet (reseau, ou URL invalide)."; exit 1 ;;
            *) echo "Reponse inattendue, le projet est peut-etre encore en pause."; exit 1 ;;
          esac
